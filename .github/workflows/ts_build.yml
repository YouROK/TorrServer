name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifacts to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - linux
          - appimage
          - ios
      version:
        description: Version string (leave empty for source Version + short SHA)
        required: false
        type: string

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  build-linux:
    name: Linux binaries
    if: inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'appimage'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Set version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            VER="$(sed -n 's/.*var Version = "\([^"]*\)".*/\1/p' server/version/version.go | head -1)"
            echo "VERSION=${VER}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Build Web and Docs
        env:
          REACT_APP_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          go run gen_web.go
          cd server && ~/go/bin/swag init -g web/server.go --parseInternal --parseDepth 5

      - name: Build Linux
        run: |
          LDFLAGS="-s -w -checklinkname=0 -X server/version.Version=${{ env.VERSION }}"
          mkdir -p "${{ github.workspace }}/dist"
          cd server
          export CGO_ENABLED=0

          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-amd64" ./cmd
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-arm64" ./cmd
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-arm7" ./cmd

          if [ "${{ inputs.target }}" != "appimage" ]; then
            GOOS=linux GOARCH=arm GOARM=5 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-arm5" ./cmd
            GOOS=linux GOARCH=386 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-386" ./cmd
            GOOS=linux GOARCH=mips GOMIPS=softfloat go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-mips" ./cmd
            GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-mipsle" ./cmd
            GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-mips64" ./cmd
            GOOS=linux GOARCH=mips64le GOMIPS64=softfloat go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-mips64le" ./cmd
            GOOS=linux GOARCH=riscv64 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-linux-riscv64" ./cmd
            GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -tags="nosqlite gst" -trimpath -o "${{ github.workspace }}/dist/TorrServer-gst-linux-amd64" ./cmd
            GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -tags="nosqlite gst" -trimpath -o "${{ github.workspace }}/dist/TorrServer-gst-linux-arm64" ./cmd
          fi

      - name: Verify static Linux binary (no shared libs)
        run: |
          bin="${{ github.workspace }}/dist/TorrServer-linux-amd64"
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "Expected a statically linked binary without DT_NEEDED entries:" >&2
            readelf -d "$bin" | grep NEEDED >&2 || true
            exit 1
          fi
          echo "OK: TorrServer-linux-amd64 has no dynamic library dependencies"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  build-android:
    name: Android binaries
    if: inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Set version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            VER="$(sed -n 's/.*var Version = "\([^"]*\)".*/\1/p' server/version/version.go | head -1)"
            echo "VERSION=${VER}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build Web
        env:
          REACT_APP_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: go run gen_web.go

      - name: Build Android
        run: |
          LDFLAGS="-s -w -checklinkname=0 -X server/version.Version=${{ env.VERSION }}"
          mkdir -p "${{ github.workspace }}/dist"
          export NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          cd server

          CC=$NDK_TOOLCHAIN/bin/armv7a-linux-androideabi21-clang CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-android-arm7" ./cmd
          CC=$NDK_TOOLCHAIN/bin/aarch64-linux-android21-clang CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-android-arm64" ./cmd
          CC=$NDK_TOOLCHAIN/bin/i686-linux-android21-clang CGO_ENABLED=1 GOOS=android GOARCH=386 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-android-386" ./cmd
          CC=$NDK_TOOLCHAIN/bin/x86_64-linux-android21-clang CGO_ENABLED=1 GOOS=android GOARCH=amd64 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "${{ github.workspace }}/dist/TorrServer-android-amd64" ./cmd

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-android
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  build-appimage:
    name: Linux AppImage
    needs: build-linux
    if: |
      always() &&
      (inputs.target == 'all' || inputs.target == 'appimage') &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch_name: amd64
            binary: TorrServer-linux-amd64
            appimage_arch: x86_64
          - arch_name: arm64
            binary: TorrServer-linux-arm64
            appimage_arch: aarch64
          - arch_name: arm7
            binary: TorrServer-linux-arm7
            appimage_arch: armhf
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fuse libfuse2

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries-linux
          path: ./dist

      - name: Build AppDir
        run: |
          APPDIR="${{ github.workspace }}/TorrServer.AppDir"
          mkdir -p "$APPDIR/usr/bin"

          cp "./dist/${{ matrix.binary }}" "$APPDIR/usr/bin/torrserver"
          chmod +x "$APPDIR/usr/bin/torrserver"

          cat > "$APPDIR/torrserver.desktop" <<EOF
          [Desktop Entry]
          Name=TorrServer
          Comment=Torrent streaming server
          Exec=torrserver
          Icon=torrserver
          Type=Application
          Categories=Network;FileTransfer;
          Terminal=true
          EOF

          cp web/public/icon.png "$APPDIR/torrserver.png"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/torrserver" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          mkdir -p "${{ github.workspace }}/dist-appimage"
          ARCH=${{ matrix.appimage_arch }} ./appimagetool "${{ github.workspace }}/TorrServer.AppDir" \
            "${{ github.workspace }}/dist-appimage/TorrServer-linux-${{ matrix.arch_name }}.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-appimage-${{ matrix.arch_name }}
          path: ${{ github.workspace }}/dist-appimage/*.AppImage
          if-no-files-found: error

  build-ios:
    name: iOS XCFramework
    if: inputs.target == 'all' || inputs.target == 'ios'
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.6"
      IOS_VERSION_MIN: "18.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode Version (${{ env.XCODE_VERSION }})
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            VER="$(sed -n 's/.*var Version = "\([^"]*\)".*/\1/p' server/version/version.go | head -1)"
            echo "VERSION=${VER}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build TorrServerKit.xcframework
        run: |
          chmod +x build-ios.sh
          ./build-ios.sh

      - name: Upload iOS XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-ios
          path: ${{ github.workspace }}/dist/TorrServer-ios-TorrServerKit.xcframework.zip
          if-no-files-found: error
