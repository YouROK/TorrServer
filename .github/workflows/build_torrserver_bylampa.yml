name: Build Releases

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Repository test
        run: |
          echo "Fork works"
          pwd
          ls -la

      - name: Apply byLampa patch
        shell: bash
        run: |
          set -euxo pipefail

          FILE="server/web/waf/referer.go"

          if [ ! -f "$FILE" ]; then
            echo "File not found: $FILE"
            exit 1
          fi

          sed -i '/"bylampa\.online"/d' "$FILE"

          echo "Verification"

          if grep -q '"bylampa.online"' "$FILE"; then
            echo "Patch failed"
            exit 1
          fi

          echo "Patch OK"
