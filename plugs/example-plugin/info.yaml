# ===============================================================
# MANIFEST DOCUMENTATION - every field explained
# ===============================================================
#
# This info.yaml itself is a complete reference.
# Copy it as a template when creating your own plugin.

# --- Identity --------------------------------------------------
# REQUIRED. Unique string: lowercase, no spaces, slug format.
# Used as:
#   - URL prefix:     /plugins/<id>/
#   - VFS namespace:  internal path lookup
#   - Event prefix:   plugin:<id>:*
#   - Storage prefix: <id>: (inside BoltDB)
id: "example-plugin"

# REQUIRED. Human-readable name for admin UI and plugin list.
name: "Plugin Showcase"

# Recommended. Shows in admin panel, helps debugging.
version: "1.0.1"

# Optional. Author credit.
author: "YouROK"

# Optional. Short description for plugin list.
description: >
  Demonstration plugin: documents every capability of the Silo plugin system.
  Use it as a template and reference when building your own plugins.

# --- Entry Point ----------------------------------------------
# REQUIRED (unless you only use static files).
# Path to the main JavaScript file inside the plugin archive.
# Executed once when the plugin loads (on server startup).
# All registrations (web routes, bus subscriptions) happen here.
entry: "service.js"

# --- Theme UI -------------------------------------------------
# OPTIONAL. If true, this plugin REPLACES the main page at /.
# Only ONE plugin can have this. The first loaded wins.
# Default: false (plugin lives at /plugins/<id>/)
# theme_ui: false

# --- Icon -----------------------------------------------------
# OPTIONAL. Icon for the plugin card in admin list.
# Served from the plugin's own VFS (can be /img/icon.png).
icon: "/img/logo.png"

# --- Menu Entries ---------------------------------------------
# OPTIONAL. Links added to the sidebar navigation.
# Each user sees only menu items where: user.rank >= entry.rank
# Without menu, the plugin is invisible in navigation (still accessible by URL).
menu:
  - title: "Showcase"
    route: "/"
    rank: 0

# --- Bus Events -----------------------------------------------
# WHITELIST of event topics this plugin is allowed to emit and listen to.
# If a topic is NOT listed here, permission is denied at runtime.
#
# Patterns:
#   "exact:topic"  - exactly this topic
#   "prefix:*"     - any topic starting with "prefix:"
#
# Own plugin events are always allowed (no need to list plugin:example-plugin:*).
events:
  - "system:boot"
  - "system:shutdown"
  - "torrent:*"

# --- Web Routes -----------------------------------------------
# WHITELIST of HTTP routes this plugin may register.
# If a route is NOT listed here, registration is skipped silently.
#
# Patterns:
#   "/exact"       - exactly /api/path
#   "/prefix/*"    - any path under /api/path/
#
# The actual registration happens in service.js via ts.web.get/post/etc.
routes:
  # Static files
  - "/"
  - "/index.html"
  - "/css/*"
  - "/js/*"
  - "/img/*"

  # ts.info
  - "/api/info"

  # ts.web
  - "/api/echo"

  # ts.bus
  - "/api/emit"
  - "/api/events"

  # ts.storage
  - "/api/storage/get"
  - "/api/storage/set"
  - "/api/storage/rem"
  - "/api/storage/clear"

  # ts.torrent
  - "/api/torrent/list"
  - "/api/torrent/get"
  - "/api/torrent/add"

  # ts.users
  - "/api/users/list"
  - "/api/users/get"

  # ts.http
  - "/api/http-demo"

  # ts.crypto
  - "/api/crypto/hash"
  - "/api/crypto/kdf"
  - "/api/crypto/bcrypt"
  - "/api/crypto/bcrypt-verify"
  - "/api/crypto/random"
  - "/api/crypto/encode"
  - "/api/crypto/aes"
  - "/api/crypto/compare"

  # ts.torrfs
  - "/api/torrfs/list"
  - "/api/torrfs/stat"
  - "/api/torrfs/stream"