<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="plugin.tracker-manager.page_title">Tracker Manager - Silo</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/img/site.webmanifest">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/i18n.js"></script>
    <style>
        .page-wrap {
            display: flex;
            justify-content: center;
            padding: 24px 32px;
            min-height: 100vh;
        }
        .page-inner {
            width: 100%;
            max-width: 800px;
        }
        .panel {
            max-width: 100%;
        }
        @media (max-width: 767px) {
            .page-wrap {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="page-inner">
        <header class="topbar">
            <h1 id="page-title" data-i18n="plugin.tracker-manager.title">Tracker Manager</h1>
            <a href="/admin" class="btn btn-secondary btn-sm" data-i18n="plugin.tracker-manager.back_to_admin">Back to Admin</a>
        </header>

        <section id="view">
            <div class="panel">
                <h2 data-i18n="plugin.tracker-manager.settings_title">Settings</h2>

                <fieldset class="subblock">
                    <legend data-i18n="plugin.tracker-manager.policy">Tracker Policy</legend>
                    <label class="field">
                        <span data-i18n="plugin.tracker-manager.policy_desc">Choose how trackers are applied to new torrents</span>
                        <select class="input" id="policy" style="max-width: 320px;">
                            <option value="append" data-i18n="plugin.tracker-manager.policy_append">Add to existing</option>
                            <option value="replace" data-i18n="plugin.tracker-manager.policy_replace">Replace existing</option>
                            <option value="remove" data-i18n="plugin.tracker-manager.policy_remove">Remove all trackers (DHT only)</option>
                            <option value="none" data-i18n="plugin.tracker-manager.policy_none">Do not modify</option>
                        </select>
                    </label>
                </fieldset>

                <fieldset class="subblock">
                    <legend data-i18n="plugin.tracker-manager.trackers_list">Trackers</legend>
                    <label class="field">
                        <span data-i18n="plugin.tracker-manager.trackers_desc">One tracker per line</span>
                        <textarea
                                class="input"
                                id="trackers"
                                rows="14"
                                placeholder="http://tracker.example.com/announce"
                                style="font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical;"
                        ></textarea>
                    </label>
                    <p class="hint" data-i18n="plugin.tracker-manager.hint">Leave empty to disable custom trackers injection</p>
                </fieldset>

                <div class="row" style="justify-content: flex-end; margin-top: 8px;">
                    <button class="btn btn-secondary" id="btn-default" type="button" data-i18n="plugin.tracker-manager.default">Restore Defaults</button>
                    <button class="btn" id="btn-save" type="button" data-i18n="plugin.tracker-manager.save">Save & Apply</button>
                </div>
            </div>
        </section>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="/plugins/tracker-manager/js/app.js"></script>
</body>
</html>
