<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Silo - Sign in</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/img/site.webmanifest">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/i18n.js"></script>
</head>
<body class="login-body">
<form class="login-card" id="login-form">
    <div class="login-brand">
        <img src="/img/favicon-96x96.png" alt="">
        <h1>SILO</h1>
    </div>

    <label class="field">
        <span data-i18n="username">Username</span>
        <input class="input" name="username" autocomplete="username" required>
    </label>
    <label class="field">
        <span data-i18n="password">Password</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required>
    </label>

    <p class="login-error" id="login-error"></p>

    <button class="btn" type="submit" data-i18n="sign_in">Sign in</button>

    <button class="btn btn-secondary" id="signout" type="button" style="display:none; margin-top:8px" data-i18n="sign_out_switch">
        Sign out &amp; switch account
    </button>

    <p class="login-notice" id="login-notice" style="display:none"></p>
</form>

<div class="toast" id="toast"></div>

<script>
    const t = (key, def) => (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key, def) : key;

    function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2500);
    }

    // safeFrom защищает от open redirect: только относительные пути на этом же хосте.
    function safeFrom(raw) {
        if (!raw) return '/';
        if (raw[0] !== '/') return '/';
        if (raw[1] === '/' || raw[1] === '\\') return '/';
        return raw;
    }

    i18n.apply();

    const params = new URLSearchParams(location.search);
    const from = safeFrom(params.get('from'));

    if (params.get('error') === 'forbidden') {
        const notice = document.getElementById('login-notice');
        notice.style.display = 'block';
        notice.textContent = t('forbidden_notice');
        document.getElementById('signout').style.display = 'block';

        const clean = '/login' + (from !== '/' ? '?from=' + encodeURIComponent(from) : '');
        history.replaceState(null, '', clean);
    }

    document.getElementById('signout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = '';

        const fd = new FormData(e.target);
        let res;
        try {
            res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: fd.get('password'),
                }),
            });
        } catch (err) {
            errorEl.textContent = t('server_unreachable');
            showToast(t('server_unreachable'));
            return;
        }

        if (!res.ok) {
            let msg = t('invalid_credentials');
            try {
                const j = await res.json();
                if (j && j.error) msg = j.error;
            } catch (err) {}
            errorEl.textContent = msg;
            showToast(msg);
            return;
        }

        location.href = from;
    });
</script>
</body>
</html>
